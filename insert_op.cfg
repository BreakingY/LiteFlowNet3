aipp_op {
    aipp_mode: static
    related_input_rank: 0
    input_format :  RGB888_U8
    src_image_size_w : 768
    src_image_size_h : 384

    csc_switch : false
    
    rbuv_swap_switch : false

    crop: false 

    # 3. 归一化配置：pixel_out_chx(i)=[pixel_in_chx(i)-mean_chn_i-min_chn_i]*var_reci_chn_i
    # NeuFlow归一化操作为R = R /255.0
    min_chn_0 : 0 
    min_chn_1 : 0
    min_chn_2 : 0
    mean_chn_0: 0
    mean_chn_1: 0
    mean_chn_2: 0
    var_reci_chn_0: 0.003921568627451
    var_reci_chn_1: 0.003921568627451
    var_reci_chn_2: 0.003921568627451
}
